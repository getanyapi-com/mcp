name: ci

on:
  push:
  pull_request:

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run check

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # The image is how Glama and any Docker-based client build this server, so
      # a Dockerfile that stopped building would break them without failing CI.
      - run: docker build -t anyapi-mcp:ci .
      # The proxy reads its tools from the hosted server, so a container that
      # starts and lists ten tools proves the network path from a clean image.
      - run: |
          docker run -i --rm anyapi-mcp:ci <<'JSONRPC' | tee /tmp/out.jsonl
          {"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2025-06-18","capabilities":{},"clientInfo":{"name":"ci","version":"1"}}}
          {"jsonrpc":"2.0","method":"notifications/initialized"}
          {"jsonrpc":"2.0","id":2,"method":"tools/list","params":{}}
          JSONRPC
          grep -q '"name":"run_api"' /tmp/out.jsonl
