name: publish

on:
  push:
    tags:
      - 'v*'

jobs:
  npm:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
          cache: npm
      # Trusted publishing needs npm 11.5.1 or newer; the runner ships an older one.
      - run: npm install -g npm@latest
      - run: npm ci
      - run: npm run check
      # No token. npm authenticates over OIDC against the trusted publisher
      # configured for this repository and this workflow file, and attaches
      # provenance automatically.
      - run: npm publish --access public

  ghcr:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=raw,value=latest
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  # The MCP Registry only stores metadata, and it verifies that metadata by
  # fetching the artifacts it points at: the npm package must already serve
  # `mcpName`, and the image must already carry the matching label. So this runs
  # only after both publishes succeeded.
  registry:
    needs: [npm, ghcr]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - name: Install mcp-publisher
        run: |
          curl -L "https://github.com/modelcontextprotocol/registry/releases/latest/download/mcp-publisher_$(uname -s | tr '[:upper:]' '[:lower:]')_$(uname -m | sed 's/x86_64/amd64/;s/aarch64/arm64/').tar.gz" | tar xz mcp-publisher
      # No secret. The registry reads the workflow's OIDC token and grants the
      # namespace of the repository owner, which is io.github.getanyapi-com/*.
      - run: ./mcp-publisher login github-oidc
      - run: ./mcp-publisher publish
